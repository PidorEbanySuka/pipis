<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap">
    <div class="panel">
      <div class="langRow">
        <select id="from" class="sel"></select>

        <button id="swap" class="swap" type="button" title="Поменять языки" aria-label="swap">
          ⇄
        </button>

        <select id="to" class="sel"></select>
      </div>

      <div class="card cardInput">
        <textarea id="src" class="ta" placeholder="Введите текст..." maxlength="5000"></textarea>

        <!-- Бейдж автоопределения (появится только когда from=auto и язык определён) -->
        <div id="detectedBadge" class="detectedBadge" hidden></div>

        <div class="metaRow">
          <div id="counter" class="counter">0/5000</div>
          <div id="hint" class="hint"></div>
        </div>
      </div>

      <div class="card cardOut">
        <textarea id="dst" class="ta taOut" placeholder="Перевод появится здесь..." readonly></textarea>

        <button id="copy" class="copyBtn" type="button" title="Копировать перевод" aria-label="copy">
          <!-- простая иконка как на скрине -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M16 1H6a2 2 0 0 0-2 2v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="8" y="7" width="14" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="toast" class="toast" hidden>Скопировано</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
