<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Translator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <div class="logo">T</div>
        <div>
          <div class="title">Переводчик</div>
          <div class="subtitle" id="subtitle">Яндекс Translate</div>
        </div>
      </div>
      <div class="pill" id="statusPill">Готов</div>
    </header>

    <section class="card controls">
      <div class="row">
        <div class="field">
          <label for="from">Исходный</label>
          <select id="from"></select>
          <div class="hintline" id="detectedLine"></div>
        </div>

        <button class="swap" id="swap" title="Поменять языки местами" aria-label="swap">
          ⇄
        </button>

        <div class="field">
          <label for="to">Перевод</label>
          <select id="to"></select>
          <div class="hintline muted">Клик по переводу — копировать</div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="cardHeader">
          <div class="cardTitle">Текст</div>
          <div class="counter"><span id="srcCount">0</span>/5000</div>
        </div>
        <textarea id="src" placeholder="Введите текст…"></textarea>
      </div>

      <div class="card">
        <div class="cardHeader">
          <div class="cardTitle">Перевод</div>
          <div class="actions">
            <button class="ghost" id="copyBtn" type="button">Копировать</button>
          </div>
        </div>
        <textarea id="dst" placeholder="Перевод появится здесь…" readonly></textarea>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="error" id="hint"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app.js"></script>
</body>

</html>
