<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="row">
      <select id="from">
        <option value="auto">Автоматически определить</option>
        <option value="ru" selected>Русский</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="uk">Українська</option>
        <option value="kk">Қазақша</option>
        <option value="be">Беларуская</option>
        <option value="ar">العربية</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="hi">हिन्दी</option>
      </select>

      <button id="swap" type="button" title="Поменять языки">⇄</button>

      <select id="to">
        <option value="en" selected>English</option>
        <option value="ru">Русский</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="uk">Українська</option>
        <option value="kk">Қазақша</option>
        <option value="be">Беларуская</option>
        <option value="ar">العربية</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <textarea id="src" placeholder="Введите текст…"></textarea>

    <!-- Кнопку можно оставить, но app.js её скрывает -->
    <button id="go" type="button">Перевести</button>

    <textarea id="dst" placeholder="Перевод появится здесь…" readonly></textarea>

    <div id="hint" class="hint"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
